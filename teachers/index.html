<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Builder: teacher guide</title>
<meta name="description" content="How students find their Area of Study, build the words, check meanings, drill and use the dictionary.">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#efe7d8;--card:#fbf7ef;--ink:#2a2118;--muted:#6b5d4c;--accent:#a8691d;--ring:#d9480f;--line:#ddd0bb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:24px 16px 56px}
h1{font:700 2rem/1.15 Georgia,serif;margin:6px 0 12px}
.open{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:11px 18px;border-radius:10px}
.open:focus-visible,button:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.url{font:.9rem ui-monospace,Consolas,monospace;color:var(--muted);margin-left:10px;word-break:break-all}

section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:22px 0}
h2{font:700 1.25rem/1.2 Georgia,serif;margin:0 0 12px;display:flex;gap:10px;align-items:center}
h2 .n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font:700 .95rem system-ui,sans-serif}

/* stage: the app's content column (15% to 85% of each screenshot) fills the box */
.stage{position:relative;overflow:hidden;border-radius:10px;border:1px solid var(--line);background:#efe6d6;
  /* cropped frame height is 0.803 x width: cap width so heading, image and caption fit one screen */
  width:min(100%, calc((100vh - 190px) * 1.245));margin:0 auto}
.bar,.dots{width:min(100%, calc((100vh - 190px) * 1.245));margin-left:auto;margin-right:auto}
.frame{position:relative;width:142.86%;margin-left:-21.43%;aspect-ratio:2049/1152}
.frame img{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .45s ease}
.frame img.on{opacity:1}
.ring{position:absolute;border:3px solid var(--ring);border-radius:12px;box-shadow:0 0 0 3px rgba(255,255,255,.85);
  opacity:0;transition:opacity .3s ease;pointer-events:none}
.ring.on{opacity:1}
.cursor{position:absolute;width:26px;height:26px;margin:-2px 0 0 -3px;pointer-events:none;
  transition:left .7s cubic-bezier(.4,0,.2,1),top .7s cubic-bezier(.4,0,.2,1),opacity .3s;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.ripple{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid var(--ring);
  opacity:0;pointer-events:none}
.ripple.go{animation:ripple .55s ease-out}
@keyframes ripple{from{transform:scale(.3);opacity:.9}to{transform:scale(1.4);opacity:0}}

.bar{display:flex;align-items:center;gap:12px;margin-top:10px}
.cap{flex:1;margin:0;font-weight:600;min-height:1.5em}
.ctl{display:flex;gap:6px}
.ctl button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);
  font-size:1rem;cursor:pointer;display:grid;place-items:center}
.dots{display:flex;gap:5px;margin-top:8px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}

@media (prefers-reduced-motion:reduce){.frame img,.ring,.cursor{transition:none}.ripple.go{animation:none}}
@media screen and (max-width:600px){.cursor{width:20px;height:20px}.cap{font-size:.95rem}}
@media print{body{background:#fff}.ctl,.dots,.cursor,.ripple{display:none}section{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Word Builder: a guide for teachers</h1>
  <a class="open" href="../">Open Word Builder</a><span class="url">liaminhawai-cmd.github.io/EAL-Vocabulary-Site</span>
  <main id="steps"></main>
</div>

<script>
/* ===================================================================
   GUIDE CONTENT. One entry per step; one frame per screenshot.
   img : file in img/ (captured from the live site at 1366x768)
   cap : the caption shown under that frame
   at  : where the cursor goes and the ring is drawn, in % of the
         full screenshot {x, y, w, h}; null for no cursor
   =================================================================== */
const GUIDE = [
  { title: 'Find the Area of Study', frames: [
    { img: 'g1-home',  cap: 'Pick a language for translations.',          at: { x: 24.92, y: 34.55, w: 19.99, h: 6.12 } },
    { img: 'g1-home',  cap: 'Pick the year level.',                       at: { x: 16.03, y: 63.08, w: 21.96, h: 19.12 } },
    { img: 'g1-level', cap: 'Pick the subject.',                          at: { x: 16.03, y: 39.47, w: 16.43, h: 12.92 } },
    { img: 'g1-aos',   cap: 'Pick the Unit and AOS.',                     at: { x: 39.02, y: 28.56, w: 21.96, h: 26.75 } },
  ]},
  { title: 'Command terms (every VCE subject)', frames: [
    { img: 'g1-command',       cap: 'Command Terms & Academic Language: 154 words for SACs and exams.', at: { x: 15.74, y: 25.33, w: 68.52, h: 13.36 } },
    { img: 'g1-command-lists', cap: 'Ten lists, from describe, explain, analyse to hedging and data.',   at: { x: 15.74, y: 33.35, w: 22.55, h: 27.8 } },
  ]},
  { title: 'Read the words', frames: [
    { img: 'g2-study', cap: 'Each word with its parts, meaning and translation.', at: { x: 15.74, y: 38.59, w: 68.52, h: 23.74 } },
    { img: 'g2-start', cap: 'Then start building.',                              at: { x: 72.59, y: 72.72, w: 11.67, h: 6.12 } },
  ]},
  { title: 'Build them from memory', frames: [
    { img: 'g3-build0', cap: 'The words are hidden. Tap a part…',     at: { x: 48.63, y: 41.41, w: 11.68, h: 5.44 } },
    { img: 'g3-build1', cap: '…then the box beside its meaning.',      at: { x: 74.3,  y: 78.04, w: 4.39,  h: 5.99 } },
    { img: 'g3-build2', cap: 'Next part.',                             at: { x: 31.06, y: 46.98, w: 14.47, h: 5.44 } },
    { img: 'g3-build3', cap: 'Built words drop to the bottom.',        at: null },
    { img: 'g3-build4', cap: 'Any word, in any order.',                at: { x: 69.69, y: 62.02, w: 13.62, h: 6.77 } },
  ]},
  { title: 'Check the meanings', frames: [
    { img: 'g3-checkbtn', cap: 'When every word is built.',                         at: { x: 70.92, y: 72.66, w: 13.34, h: 6.12 } },
    { img: 'g3-modes',    cap: 'Tap the translation, type it, or match the definition.', at: { x: 61.52, y: 33.77, w: 22.74, h: 11.59 } },
    { img: 'g3-check',    cap: 'Each answer is marked.',                            at: { x: 15.59, y: 32.67, w: 68.81, h: 48 } },
  ]},
  { title: 'Drill', frames: [
    { img: 'g4-pick0',            cap: 'Every word they have built, by subject and AOS.', at: { x: 15.59, y: 44.71, w: 68.81, h: 54 } },
    { img: 'g4-pick-aos',         cap: 'One AOS.',                                        at: { x: 16.84, y: 57.6,  w: 66.33, h: 6.51 } },
    { img: 'g4-pick-subject',     cap: 'A whole subject.',                                at: { x: 15.74, y: 66.59, w: 68.52, h: 20.83 } },
    { img: 'g4-pick-notmastered', cap: 'Every subject, without mastered words.',          at: { x: 38.43, y: 38.85, w: 10.09, h: 5.08 } },
    { img: 'g4-pick-learning',    cap: 'Only words still being learnt.',                  at: { x: 15.59, y: 38.59, w: 68.81, h: 5.6 } },
    { img: 'g4-settings',         cap: 'Choose the question types.',                      at: { x: 15.74, y: 31.98, w: 68.52, h: 37.08 } },
    { img: 'g4-card',             cap: 'Drill.',                                          at: { x: 15.74, y: 15.08, w: 68.52, h: 59.09 } },
  ]},
  { title: 'Dictionary', frames: [
    { img: 'g5-dict0',      cap: 'Search a word part…',             at: { x: 15.74, y: 38.46, w: 68.52, h: 6.77 } },
    { img: 'g5-dict-gen',   cap: '…to see every word that uses it.', at: { x: 15.74, y: 56.34, w: 68.52, h: 42 } },
    { img: 'g5-dict-words', cap: 'Or search a whole word.',          at: { x: 15.74, y: 52.56, w: 68.52, h: 26.07 } },
  ]},
];
/* =================================================================== */

const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const HOLD = 2300, MOVE = 750;
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const CURSOR = '<svg viewBox="0 0 24 24"><path d="M3 2l17 10-7.5 1.6L9 21z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>';

GUIDE.forEach((step, si) => {
  const sec = el('section'); sec.setAttribute('aria-labelledby', 's' + si);
  const h2 = el('h2', null, `<span class="n">${si + 1}</span><span id="s${si}">${step.title}</span>`);
  const stage = el('div', 'stage'), frame = el('div', 'frame');
  const imgs = step.frames.map((f, i) => {
    const im = el('img'); im.src = 'img/' + f.img + '.jpg'; im.alt = f.cap; im.decoding = 'async';
    if (si > 1) im.loading = 'lazy';
    frame.append(im); return im;
  });
  const ring = el('div', 'ring'), ripple = el('div', 'ripple'), cursor = el('div', 'cursor', CURSOR);
  cursor.style.left = '60%'; cursor.style.top = '90%';
  frame.append(ring, ripple, cursor); stage.append(frame);
  const cap = el('p', 'cap'); cap.setAttribute('aria-live', 'polite');
  const prev = el('button', null, '&#9664;'), play = el('button', null, ''), next = el('button', null, '&#9654;');
  prev.setAttribute('aria-label', 'Previous'); next.setAttribute('aria-label', 'Next');
  const ctl = el('div', 'ctl'); ctl.append(prev, play, next);
  const bar = el('div', 'bar'); bar.append(cap, ctl);
  const dots = el('div', 'dots'); step.frames.forEach(() => dots.append(el('i')));
  sec.append(h2, stage, bar, dots); document.getElementById('steps').append(sec);

  let i = 0, playing = !still, visible = false, timer = null;
  const setPlay = () => { play.innerHTML = playing ? '&#10073;&#10073;' : '&#9654;&#xFE0E;'; play.setAttribute('aria-label', playing ? 'Pause' : 'Play'); };

  function show(n, animate) {
    clearTimeout(timer);
    i = (n + step.frames.length) % step.frames.length;
    const f = step.frames[i];
    imgs.forEach((im, k) => im.classList.toggle('on', k === i));
    cap.textContent = f.cap;
    [...dots.children].forEach((d, k) => d.classList.toggle('on', k === i));
    ring.classList.remove('on');
    if (!f.at) { cursor.style.opacity = '0'; return; }
    const a = { ...f.at, h: Math.min(f.at.h, 98 - f.at.y) };
    Object.assign(ring.style, { left: a.x + '%', top: a.y + '%', width: a.w + '%', height: a.h + '%' });
    const cx = a.x + Math.min(a.w / 2, 4), cy = a.y + Math.min(a.h / 2, 5);
    cursor.style.opacity = '1';
    if (!animate) { cursor.style.transition = 'none'; }
    cursor.style.left = cx + '%'; cursor.style.top = cy + '%';
    if (!animate) { cursor.offsetWidth; cursor.style.transition = ''; ring.classList.add('on'); return; }
    timer = setTimeout(() => {
      ripple.style.left = cx + '%'; ripple.style.top = cy + '%';
      ripple.classList.remove('go'); ripple.offsetWidth; ripple.classList.add('go');
      ring.classList.add('on');
    }, MOVE);
  }
  function tick() {
    if (!playing || !visible) return;
    timer = setTimeout(() => {
      if (!playing || !visible) return;
      const last = i === step.frames.length - 1;
      show(i + 1, true);
      setTimeout(tick, last ? 900 : 0);
    }, HOLD + (step.frames[i].at ? MOVE : 0));
  }
  prev.onclick = () => { playing = false; setPlay(); show(i - 1, !still); };
  next.onclick = () => { playing = false; setPlay(); show(i + 1, !still); };
  play.onclick = () => { playing = !playing; setPlay(); if (playing) tick(); else clearTimeout(timer); };
  setPlay();
  show(0, false);
  new IntersectionObserver(([e]) => {
    const was = visible; visible = e.isIntersecting && e.intersectionRatio > 0.35;
    if (visible && !was) { show(i, !still); tick(); } else if (!visible) clearTimeout(timer);
  }, { threshold: [0, 0.35, 0.7, 1] }).observe(stage);
});
</script>
</body>
</html>
